name: Agro E2E Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/pages/Agro*.tsx'
      - 'src/components/Agro*.tsx'
      - 'src/pages/agroApiEndpoints.ts'
      - 'src/pages/agroOportunidadesContract.ts'
      # Backend Agro específico (evita apps/api/** amplo demais).
      - 'apps/api/wave1_repository.py'
      - 'apps/api/routes.py'
      - 'staging/agro_external_gate.py'
      - '.github/workflows/agro-e2e.yml'
  pull_request:
    paths:
      - 'src/pages/Agro*.tsx'
      - 'src/components/Agro*.tsx'
      - 'src/pages/agroApiEndpoints.ts'
      - 'src/pages/agroOportunidadesContract.ts'
      - 'apps/api/wave1_repository.py'
      - 'apps/api/routes.py'
      - 'staging/agro_external_gate.py'
      - '.github/workflows/agro-e2e.yml'

jobs:
  agro-e2e:
    runs-on: ubuntu-latest
    env:
      WINS_HUB_BASE: https://winshubcomercial.com.br
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Computa base e head do diff
        id: base
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.event.after }}"
              if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '')"
              fi
              ;;
            *)
              BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '')"
              HEAD_SHA="$(git rev-parse HEAD)"
              ;;
          esac
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$HEAD_SHA"
          fi
          echo "base=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      # apps/api/routes.py é compartilhado entre autenticação e Agro. Os `paths`
      # do GitHub Actions não distinguem hunks: uma alteração apenas de auth
      # nesse arquivo ainda dispara este workflow. Detectamos a relevância real:
      # se routes.py mudou mas o diff não toca endpoints/símbolos Agro, o job
      # encerra com sucesso (summary) sem instalar Playwright. O diff NUNCA é
      # impresso (evita expor conteúdo sensível).
      - name: Detecta relevância Agro real do diff
        id: relevance
        shell: bash
        run: |
          BASE_SHA="${{ steps.base.outputs.base }}"
          HEAD_SHA="${{ steps.base.outputs.head }}"
          routes_changed=false
          while IFS= read -r -d '' f; do
            case "$f" in
              apps/api/routes.py) routes_changed=true ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")
          if [ "$routes_changed" = "true" ]; then
            if git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- apps/api/routes.py \
              | grep -iE '^[+-].*(agro|oportunidade|propriedade|fazenda|wave1|holdings|genetic|logistic|leads|carencia)' > /dev/null; then
              echo "agro_relevant=true" >> "$GITHUB_OUTPUT"
            else
              echo "agro_relevant=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Sem routes.py no diff, o paths filter já garantiu relevância Agro.
            echo "agro_relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - name: routes.py sem relevância Agro — job encerrado
        if: steps.relevance.outputs.agro_relevant == 'false'
        shell: bash
        run: |
          {
            echo "## Agro E2E: não executado"
            echo ""
            echo "\`apps/api/routes.py\` mudou, mas o diff não contém alterações relacionadas a endpoints ou símbolos Agro (alteração apenas de autenticação/outros)."
            echo "Como \`paths\` do GitHub Actions não distinguem hunks, o workflow foi disparado; a detecção de relevância real encerrou o job com sucesso."
            echo "Nenhum teste E2E externo foi executado e o Playwright não foi instalado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: steps.relevance.outputs.agro_relevant == 'true'
        run: |
          pip install playwright
          python3 -m playwright install chromium

      # FASE 5 — Segredos nunca são impressos. Apenas verifica presença.
      # PR de fork não recebe segredos de produção; neste caso o job é
      # explicitamente pulado com summary explicativo (sem "No jobs were run").
      # O `id` é gate_credentials para o próprio secret scan não capturá-lo.
      - name: Verifica credenciais do gate (sem exibir valores)
        if: steps.relevance.outputs.agro_relevant == 'true'
        id: gate_credentials
        env:
          GATE_USER: ${{ secrets.WINS_HUB_GATE_USER }}
          GATE_PASSWORD: ${{ secrets.WINS_HUB_GATE_PASSWORD }}
        run: |
          if [ -z "$GATE_USER" ] || [ -z "$GATE_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip explícito quando credenciais indisponíveis
        if: steps.relevance.outputs.agro_relevant == 'true' && steps.gate_credentials.outputs.available == 'false'
        shell: bash
        run: |
          {
            echo "## Agro E2E: job não executado"
            echo ""
            echo "Motivo: \`WINS_HUB_GATE_USER\`/\`WINS_HUB_GATE_PASSWORD\` indisponíveis neste evento (ex.: PR de fork não recebe segredos de produção)."
            echo "Nenhuma autenticação foi tentada."
            echo ""
            echo "> Para executar manualmente, use \`workflow_dispatch\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # FASE 6 — Semântica do gate externo de produção:
      #   * pull_request: testa o bundle ATUALMENTE PUBLICADO, não o código do
      #     PR. Por isso é INFORMATIVO (continue-on-error) e não bloqueia.
      #   * push em main: pós-deploy, valida a implantação — BLOQUEANTE.
      #   * workflow_dispatch: manual — BLOQUEANTE (operador decide).
      # Testes reproduzíveis do código do PR ficam em ci.yml (focused-tests /
      # frontend-quality), que são os bloqueantes.
      - name: E2E — Agro External Gate (produção)
        if: steps.relevance.outputs.agro_relevant == 'true' && steps.gate_credentials.outputs.available == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          WINS_HUB_GATE_USER: ${{ secrets.WINS_HUB_GATE_USER }}
          WINS_HUB_GATE_PASSWORD: ${{ secrets.WINS_HUB_GATE_PASSWORD }}
        run: python3 staging/agro_external_gate.py

      - name: Resumo da semântica do gate
        if: steps.relevance.outputs.agro_relevant == 'true' && steps.gate_credentials.outputs.available == 'true'
        shell: bash
        run: |
          {
            echo "## Agro E2E — gate externo de produção"
            echo ""
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Este teste consulta **o bundle atualmente publicado** (winshubcomercial.com.br), **não o código deste PR** — portanto é **informativo** e não bloqueia."
            else
              echo "Execução **bloqueante** (push em \`main\` ou manual): valida a implantação publicada."
            fi
            echo ""
            echo "Testes reproduzíveis do código do PR (bloqueantes) são executados em \`ci.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Secret scan — detecta VALORES hardcoded (atribuição de literal a chave
      # sensível), não palavras técnicas: nomes de steps, comentários, docs e
      # identificadores do workflow não disparam. `id` do passo acima é
      # gate_credentials (fora do padrão de captura).
      - name: Secret scan — detecta valores hardcoded
        run: |
          if grep -rEnE '(WINS_HUB_GATE_USER|WINS_HUB_GATE_PASSWORD|password|senha|secret|api[_-]?key|token)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{2,}["'"'"']' \
            --include='*.py' --include='*.yml' --include='*.yaml' \
            --include='*.json' --include='*.ts' --include='*.tsx' \
            .github/ staging/ | grep -v 'node_modules' ; then
            echo "ERRO: Possível credencial hardcoded detectada"
            exit 1
          fi
          echo "Nenhum valor de credencial hardcoded encontrado"
