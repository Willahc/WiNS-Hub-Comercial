name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # JOB 1 — Qualidade de Python restrita ao diff.
  # Bloqueia somente erros Ruff nos arquivos .py alterados pelo PR/push.
  # O baseline global do repositório NÃO deve bloquear PRs não relacionados.
  changed-python-quality:
    name: Python (diff-aware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala ruff
        run: pip install ruff

      - name: Computa base e head do diff
        id: base
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.event.after }}"
              if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '')"
              fi
              ;;
            *)
              BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '')"
              HEAD_SHA="$(git rev-parse HEAD)"
              ;;
          esac
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$HEAD_SHA"
          fi
          echo "base=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Lint dos arquivos Python alterados
        shell: bash
        run: |
          BASE_SHA="${{ steps.base.outputs.base }}"
          HEAD_SHA="${{ steps.base.outputs.head }}"
          py_files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *.py)
                # somente arquivos que ainda existem no HEAD
                if [ -f "$f" ]; then
                  py_files+=("$f")
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")
          if [ "${#py_files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo Python alterado neste evento."
            exit 0
          fi
          printf '%s\0' "${py_files[@]}" | xargs -0 ruff check

  # JOB 2 — Testes focados no que mudou.
  # Ruff global NÃO impede a execução destes testes.
  focused-tests:
    name: Testes focados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala deps de teste
        run: |
          pip install pytest pyjwt bcrypt pyotp
          # deps de apps/api (fastapi/TestClient) para testes atuais de auth.
          if [ -f apps/api/requirements.txt ]; then
            pip install -r apps/api/requirements.txt
          fi

      - name: Computa base e head do diff
        id: base
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.event.after }}"
              if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '')"
              fi
              ;;
            *)
              BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '')"
              HEAD_SHA="$(git rev-parse HEAD)"
              ;;
          esac
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$HEAD_SHA"
          fi
          echo "base=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Detecta escopo alterado
        id: scope
        shell: bash
        run: |
          BASE_SHA="${{ steps.base.outputs.base }}"
          HEAD_SHA="${{ steps.base.outputs.head }}"
          auth=false
          agro=false
          agro_backend=false
          while IFS= read -r -d '' f; do
            # Verificações INDEPENDENTES: apps/api/routes.py pode pertencer a
            # auth E Agro ao mesmo tempo. `case` único pararia na 1a correspondência.
            case "$f" in
              apps/api/auth.py|apps/api/routes.py|apps/api/test_auth_session.py|app/tests/test_auth.py|src/services/auth/*|src/services/auth.tsx|src/tests/auth.test.tsx|public/logout-maintenance.html)
                auth=true ;;
            esac
            case "$f" in
              apps/api/wave1_repository.py|apps/api/routes.py|staging/agro_external_gate.py|app/tests/test_fase0d_farms_v2.py|app/tests/test_fase2_pasture_live_domain.py|src/pages/Agro*|src/components/Agro*|src/pages/agroApiEndpoints.ts|src/pages/agroOportunidadesContract.ts)
                agro=true ;;
            esac
            case "$f" in
              apps/api/wave1_repository.py|apps/api/routes.py|staging/agro_external_gate.py)
                agro_backend=true ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")
          echo "auth=${auth}" >> "$GITHUB_OUTPUT"
          echo "agro=${agro}" >> "$GITHUB_OUTPUT"
          echo "agro_backend=${agro_backend}" >> "$GITHUB_OUTPUT"

      - name: Testes de autenticação (arquitetura atual + legado)
        if: steps.scope.outputs.auth == 'true'
        env:
          # Valores dummy: permitem importar apps/api (config/database) em CI
          # sem banco. Os pools de conexão falham no import e são capturados;
          # os testes de sessão não tocam o banco.
          DB_PASS: ci-dummy
          DB_WRITE_PASS: ci-dummy
          DB_AGRO_USER: ci-dummy
          DB_AGRO_PASS: ci-dummy
          DB_LOG_USER: ci-dummy
          DB_LOG_PASS: ci-dummy
          DB_SAUDE_USER: ci-dummy
          DB_SAUDE_PASS: ci-dummy
        shell: bash
        run: |
          # apps/api/test_auth_session.py = arquitetura atual; app/tests/test_auth.py = legado.
          # apps/api/test_api.py é excluído: sobe uvicorn local com caminho hardcoded, não cabe em CI.
          auth_tests=()
          for t in apps/api/test_auth_session.py; do
            [ -f "$t" ] && auth_tests+=("$t")
          done
          legacy_tests=()
          for t in app/tests/test_auth.py; do
            [ -f "$t" ] && legacy_tests+=("$t")
          done
          if [ "${#auth_tests[@]}" -eq 0 ] && [ "${#legacy_tests[@]}" -eq 0 ]; then
            echo "Alteração de autenticação sem teste focado disponível."
            exit 1
          fi
          # Invocações separadas: evita colisão do módulo `auth` entre apps/api/ e app/
          # no sys.path do pytest.
          if [ "${#auth_tests[@]}" -gt 0 ]; then
            pytest "${auth_tests[@]}" -q
          fi
          if [ "${#legacy_tests[@]}" -gt 0 ]; then
            pytest "${legacy_tests[@]}" -q
          fi
          if [ "${#auth_tests[@]}" -eq 0 ]; then
            echo "::warning::Sem teste de autenticação atual em apps/api (test_auth_session.py); executado apenas o legado app/tests/test_auth.py."
          fi

      - name: Testes Agro backend (atual apps/api ou legado compatível)
        if: steps.scope.outputs.agro_backend == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          agro_current=(apps/api/test_agro*.py)
          if [ "${#agro_current[@]}" -gt 0 ]; then
            pytest "${agro_current[@]}" -q
            exit $?
          fi
          legacy=()
          for t in app/tests/test_fase0d_farms_v2.py app/tests/test_fase2_pasture_live_domain.py; do
            [ -f "$t" ] && legacy+=("$t")
          done
          if [ "${#legacy[@]}" -eq 0 ]; then
            echo "Alteração de backend Agro sem teste focado disponível."
            exit 1
          fi
          pytest "${legacy[@]}" -q
          {
            echo "## Aviso: testes backend Agro (legado)"
            echo ""
            echo "Nenhum teste atual em \`apps/api\` para backend Agro (\`test_agro*.py\`)."
            echo "Executados testes legados compatíveis: \`${legacy[*]}\`."
            echo ""
            echo "**PRs futuros** que alterem \`apps/api/wave1_repository.py\` ou endpoints Agro devem incluir teste específico em \`apps/api/\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Vitest cobre auth.tsx (auth) e páginas Agro (agro) quando alterados.
      # O diff de frontend genérico (src/ sem auth/Agro) é coberto em frontend-quality.
      - name: Setup Node (para Vitest)
        if: steps.scope.outputs.auth == 'true' || steps.scope.outputs.agro == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Testes frontend (Vitest)
        if: steps.scope.outputs.auth == 'true' || steps.scope.outputs.agro == 'true'
        run: |
          npm ci
          npx vitest run

  # JOB 3 — Baseline global do repositório.
  # Informativo e NÃO bloqueante, até redução controlada da dívida técnica.
  # TODO: tornar bloqueante após redução controlada do baseline.
  repository-baseline:
    name: Baseline global (não bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala ruff
        run: pip install ruff

      - name: Ruff global — estatística (não bloqueia)
        shell: bash
        run: |
          set +e
          total=$(ruff check . --output-format=json 2>/dev/null | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          codes=$(ruff check . --statistics 2>/dev/null | tail -8)
          {
            echo "## Baseline Ruff global"
            echo ""
            echo "Total de erros no repositório inteiro: **${total}**"
            echo ""
            echo "\`\`\`"
            echo "${codes}"
            echo "\`\`\`"
            echo ""
            echo "> Job informativo: **não bloqueia** PRs. Erros dos arquivos alterados são validados estritamente em \`changed-python-quality\`."
            echo "> TODO: tornar bloqueante após redução controlada do baseline."
          } >> "$GITHUB_STEP_SUMMARY"

  # JOB 4 — Qualidade frontend (somente quando frontend muda).
  # IMPORTANTE: NUNCA usar `npm run build` — o script `build` deste repositório
  # executa deploy para /opt/winshub/spa e reload do Nginx.
  # GitHub Actions nunca deve executar comandos de deploy.
  frontend-quality:
    name: Frontend (tsc/vitest/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Computa base e head do diff
        id: base
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.event.after }}"
              if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '')"
              fi
              ;;
            *)
              BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '')"
              HEAD_SHA="$(git rev-parse HEAD)"
              ;;
          esac
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$HEAD_SHA"
          fi
          echo "base=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Detecta alterações de frontend
        id: fe
        shell: bash
        run: |
          BASE_SHA="${{ steps.base.outputs.base }}"
          HEAD_SHA="${{ steps.base.outputs.head }}"
          changed=false
          while IFS= read -r -d '' f; do
            case "$f" in
              src/*|public/*|index.html|package.json|package-lock.json|vite.config.ts|tsconfig*.json)
                changed=true ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Instala dependências frontend
        if: steps.fe.outputs.changed == 'true'
        run: npm ci

      # Bloqueante: vitest é verde no baseline de origin/main (21 testes) e
      # pega regressões reais de comportamento do código alterado.
      - name: Testes frontend (Vitest — bloqueante)
        if: steps.fe.outputs.changed == 'true'
        run: npx vitest run

      # Aviso de baseline: em origin/main, `tsc -b` reporta ~222 erros e
      # `vite build` falha (componentes referenciados por main ausentes:
      # AppSidebar, territorial/BrazilUfSelect, relationshipCatalog — PR #6
      # repara isso). Por isso tsc/build são INFORMATIVOS abaixo.
      # TODO: tornar bloqueante após reparo do baseline frontend.
      - name: Typecheck (tsc — informativo, baseline vermelho)
        if: steps.fe.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc -b > /tmp/tsc.log 2>&1
          rc=$?
          total=$(grep -cE "error TS" /tmp/tsc.log)
          {
            echo "## Typecheck (tsc -b) — informativo"
            echo ""
            echo "Código de saída: \`${rc}\` — erros TS: **${total}**"
            echo ""
            echo "> Baseline de \`origin/main\` já contém ~222 erros (dívida histórica). Não bloqueia este PR."
            echo "> TODO: tornar bloqueante após redução controlada do baseline."
          } >> "$GITHUB_STEP_SUMMARY"

      # Build separado — sem deploy. `npm run build` NÃO pode ser usado.
      # O script `build` deste repositório executa deploy para /opt/winshub/spa
      # e reload do Nginx. GitHub Actions nunca executa comandos de deploy.
      - name: Build (vite build — informativo, sem deploy)
        if: steps.fe.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx vite build > /tmp/vite.log 2>&1
          rc=$?
          {
            echo "## Build (vite build) — informativo"
            echo ""
            echo "Código de saída: \`${rc}\`"
            echo ""
            echo "> Baseline de \`origin/main\` já falha no build (imports não resolvidos — componentes ausentes em main). Não bloqueia este PR."
            echo "> TODO: tornar bloqueante após reparo do baseline frontend."
          } >> "$GITHUB_STEP_SUMMARY"
