# WiNS Hub produção — HTTPS 443 (Canonical — versionado no repositório)
# Atualizado: 2026-07-30 — Correção de callback OAuth em /engenharia/
#
# Este arquivo é o template canônico para /etc/nginx/sites-enabled/winshubcomercial.com.br.conf
# Regra de ouro: location = /engenharia/ DEVE servir a SPA (não proxy ao backend)
# pois é a rota de callback OAuth após autenticação Keycloak.

limit_req_zone $binary_remote_addr zone=hub_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hub_gen:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hub_login:10m rate=5r/m;
upstream hub_saude_api   { server 127.0.0.1:18080; keepalive 8; }
upstream hub_engenharia  { server 127.0.0.1:18081; keepalive 8; }
upstream hub_log_api     { server 127.0.0.1:18082; keepalive 8; }
upstream hub_agro_api    { server 127.0.0.1:18083; keepalive 16; }
upstream hub_review_api  { server 127.0.0.1:18085; keepalive 16; }
upstream hub_main_api    { server 127.0.0.1:18085; keepalive 16; }
upstream hub_keycloak    { server 127.0.0.1:18086; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name winshubcomercial.com.br www.winshubcomercial.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://winshubcomercial.com.br$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name www.winshubcomercial.com.br;
    ssl_certificate     /etc/letsencrypt/live/winshubcomercial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winshubcomercial.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://winshubcomercial.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name winshubcomercial.com.br;
    ssl_certificate     /etc/letsencrypt/live/winshubcomercial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winshubcomercial.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    access_log /var/log/nginx/winshubcomercial_access.log;
    error_log  /var/log/nginx/winshubcomercial_error.log;
    server_tokens off;
    client_max_body_size 12m;
    include /etc/nginx/snippets/wins-hub-security-headers.conf;

    # -- Security blocks --
    location ~* (\.env|\.git|\.sql|\.dump|\.gpg|Dockerfile|requirements\.txt|\.bak) { return 404; }
    location ~ /\. { return 404; }
    location ^~ /caminhao-vazio { return 404; }
    location ^~ /comercial { return 404; }
    location ^~ /cliente-inteligente { return 404; }

    # -- Engenharia: OAuth callback + SPA routes + backend proxy --
    # IMPORTANTE: /engenharia (sem barra) redireciona para /engenharia/
    location = /engenharia { return 301 /engenharia/; }

    # CRÍTICO: /engenharia/ (exato) é a rota de callback OAuth pós-Keycloak.
    # NÃO proxy para backend — deve servir o index.html da SPA.
    location = /engenharia/ {
        root /opt/winshub/spa;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    # Subpaths da SPA de engenharia (React Router)
    location ^~ /engenharia/fornecedores {
        root /opt/winshub/spa;
        try_files  / /index.html;
    }

    location ^~ /engenharia/obras {
        root /opt/winshub/spa;
        try_files  / /index.html;
    }

    # Proxy para o backend legado de engenharia (subpaths com API)
    location ^~ /engenharia/ {
        limit_req zone=hub_api burst=40 nodelay;
        rewrite ^/engenharia/(.*)$ /$1 break;
        proxy_pass http://hub_engenharia;
        include /etc/nginx/snippets/wins-saude-proxy-headers.conf;
        proxy_set_header X-Forwarded-Prefix /engenharia;
        proxy_set_header X-Script-Name /engenharia;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/wins-hub-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /log { return 301 /log/; }
    location ^~ /log/ {
        limit_req zone=hub_api burst=40 nodelay;
        rewrite ^/log/(.*)$ /$1 break;
        proxy_pass http://hub_log_api;
        include /etc/nginx/snippets/wins-saude-proxy-headers.conf;
        proxy_set_header X-Forwarded-Prefix /log;
        proxy_set_header X-Script-Name /log;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/wins-hub-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /empresa-360 { return 302 /agro/empresa-360; }

    # -- Review API (preserved) --
    location /review-api/wins_review_WbY66btKiBWYzhFJ5bjRP2M8vBJ0RT70gp2FbnFtfbEDkXPxDSCq5N1btVTi/api/v1/ {
      limit_req zone=review_gate burst=20 nodelay;
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Request-Id" always;
        add_header Access-Control-Max-Age 600 always;
        return 204;
      }
      rewrite ^/review-api/[^/]+/api/v1/(.*) /api/v1/$1 break;
      proxy_pass http://hub_review_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Review-Identity "wins-hub-review-readonly";
      include /etc/nginx/snippets/wins-hub-security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      access_log /var/log/nginx/winshubcomercial_access.log review_redacted;
    }
    location /review-api/ { return 404 "Review session invalid or expired"; }

    # -- Review inspection PDF --
    location ~ ^/review/wins_review_WbY66btKiBWYzhFJ5bjRP2M8vBJ0RT70gp2FbnFtfbEDkXPxDSCq5N1btVTi/wins-hub-inspecao-final\.pdf$ {
      alias /opt/winshub/spa/wins-hub-inspecao-final.pdf;
      add_header Content-Type "application/pdf" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      limit_req zone=review_gate burst=5 nodelay;
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    }

    # -- Review SPA routes --
    location /review/ {
      root /opt/winshub/spa;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store" always;
    }

    # -- SPA API and auth proxies --
    location ^~ /api/v1/ {
        limit_req zone=hub_api burst=40 nodelay;
        proxy_pass http://hub_main_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }
    location ^~ /api/ {
        limit_req zone=hub_api burst=40 nodelay;
        proxy_pass http://hub_agro_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }
    location ^~ /auth/ {
        proxy_pass http://hub_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # -- Official SPA static assets (hashed, cacheable) --
    location /assets/ {
        root /opt/winshub/spa;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -- SPA root --
    location = / {
        root /opt/winshub/spa;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    # -- SPA entry point --
    location = /index.html {
        root /opt/winshub/spa;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # -- SPA fallback: todas as rotas não capturadas servem a SPA --
    location / {
        root /opt/winshub/spa;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
