worker_processes 1;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=wave1_api:10m rate=10r/s;
  limit_req_status 429;
  map $http_origin $cors_origin { default ""; "https://winshubcomercial.com.br:18443" $http_origin; }
  upstream wave1_api { server host.docker.internal:18085; keepalive 16; }
  upstream wave1_keycloak { server host.docker.internal:18086; keepalive 8; }
  server {
    listen 443 ssl;
    server_name winshubcomercial.com.br;
    ssl_certificate /etc/letsencrypt/live/winshubcomercial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winshubcomercial.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self'" always;
    location = /healthz {
      proxy_pass http://wave1_api/api/v1/health;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s; proxy_read_timeout 4s; proxy_send_timeout 4s;
      access_log off;
    }
    location /api/ {
      limit_req zone=wave1_api burst=20 nodelay;
      if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Methods "GET,OPTIONS" always; add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-Id" always; add_header Access-Control-Max-Age 600 always; return 204; }
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Vary Origin always;
      proxy_pass http://wave1_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s; proxy_read_timeout 10s; proxy_send_timeout 10s;
    }
    location /auth/ {
      limit_req zone=wave1_api burst=20 nodelay;
      proxy_pass http://wave1_keycloak;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 18443;
      proxy_connect_timeout 2s; proxy_read_timeout 10s; proxy_send_timeout 10s;
    }
    location /demo/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /demo/index.html;
    }
  }
}
