user root;
worker_processes auto;
pid /root/wins_hub_unificado/staging/nginx.pid;
error_log /root/wins_hub_unificado/staging/error.log notice;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log /root/wins_hub_unificado/staging/access.log;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=wave1_gate:10m rate=50r/s;
  limit_req_status 429;
  map $http_origin $cors_origin { default ""; "https://winshubcomercial.com.br:18443" $http_origin; }
  upstream wave1_api { server 127.0.0.1:18083; keepalive 32; }
  upstream hub_api { server 127.0.0.1:18085; keepalive 32; }
  upstream wave1_keycloak { server 127.0.0.1:18086; keepalive 16; }
  server {
    listen 18443 ssl;
    server_name winshubcomercial.com.br;
    ssl_certificate /etc/letsencrypt/live/winshubcomercial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winshubcomercial.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-src 'self'" always;

    location = /healthz { proxy_pass http://hub_api/api/v1/health; proxy_set_header X-Request-Id $request_id; proxy_connect_timeout 2s; proxy_read_timeout 4s; access_log off; }

    location /api/v1/ {
      limit_req zone=wave1_gate burst=100 nodelay;
      if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Methods "GET,OPTIONS" always; add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-Id" always; add_header Access-Control-Max-Age 600 always; return 204; }
      add_header Access-Control-Allow-Origin $cors_origin always; add_header Vary Origin always;
      proxy_pass http://hub_api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s; proxy_read_timeout 30s; proxy_send_timeout 10s;
    }

    location /api/ {
      limit_req zone=wave1_gate burst=100 nodelay;
      if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Methods "GET,OPTIONS" always; add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-Id" always; add_header Access-Control-Max-Age 600 always; return 204; }
      add_header Access-Control-Allow-Origin $cors_origin always; add_header Vary Origin always;
      proxy_pass http://wave1_api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s; proxy_read_timeout 30s; proxy_send_timeout 10s;
    }

    location /auth/ {
      limit_req zone=wave1_gate burst=50 nodelay;
      proxy_pass http://wave1_keycloak; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Port 18443;
      proxy_connect_timeout 2s; proxy_read_timeout 10s; proxy_send_timeout 10s;
    }

    # Canonical Root SPA Deployment
    location / {
      root /root/wins_hub_unificado/dist;
      try_files $uri $uri/ /index.html;
    }

    # 301 Redirect for Legacy /demo/ paths to Canonical Root
    location /demo/ {
      rewrite ^/demo/(.*)$ /$1 permanent;
    }

    location ^~ /mockups-v2/screenshots/ {
      alias /root/wins_hub_unificado/mockups-v2/dist/screenshots/;
      try_files $uri =404;
    }

    location ^~ /mockups-v2/review/ {
      alias /root/wins_hub_unificado/mockups-v2/dist/review/;
      try_files $uri =404;
    }

    location ^~ /mockups-v2/ {
      alias /root/wins_hub_unificado/mockups-v2/dist/;
      try_files $uri $uri/ /mockups-v2/index.html;
    }
  }
}
